specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Chatbase
providerId: chatbase
created: '2026-06-20'
modified: '2026-06-20'
reconciled: true
tags:
- AI
- Chatbot
- AI Agent
- Customer Support
- Conversational AI
- Plans
description: >-
  Chatbase uses tiered subscription plans (Free, Hobby, Standard, Pro,
  Enterprise) metered primarily by monthly message credits, with each plan
  also setting limits on the number of AI agents, training-data size, and team
  seats. Every AI response consumes message credits; consumption per response
  depends on the chosen model (1 credit for standard models, more for premium
  models). API access is available starting on the Standard plan. Annual
  billing is discounted ~20% versus monthly. Add-ons include auto-recharge
  message credits, extra agents, and branding removal.
notes: >-
  Prices and credit allotments are as published on the Chatbase pricing page
  and are subject to change; verify against chatbase.co/pricing during
  reconciliation. Monthly prices shown; annual billing is roughly 20% lower.
sources:
- https://www.chatbase.co/pricing
- https://www.chatbase.co/docs
plans:
- id: chatbase-free
  name: Free
  type: free
  description: >-
    Entry tier for trying Chatbase with one agent and limited monthly
    message credits. Agents are removed after a period of inactivity.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  - label: Message Credits
    name: message_credits
    type: usage
    metric: credits
    limit: 50
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: 1 AI Agent
  - name: 400 KB Training Data
  - name: 1 Team Seat
- id: chatbase-hobby
  name: Hobby
  type: subscription
  description: >-
    Starter paid tier adding more agents, advanced AI models, integrations,
    and basic analytics.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $40 per month ($32/mo billed annually)
    userMultiplied: false
  - label: Message Credits
    name: message_credits
    type: usage
    metric: credits
    limit: 500
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Advanced AI Models
  - name: Integrations
  - name: Basic Analytics
  - name: 10 MB Training Data
  - name: 2 Team Seats
- id: chatbase-standard
  name: Standard
  type: subscription
  description: >-
    Mid tier that unlocks API access, help desk, voice and telephony,
    outbound campaigns, advanced integrations, and auto-retraining.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $150 per month ($120/mo billed annually)
    userMultiplied: false
  - label: Message Credits
    name: message_credits
    type: usage
    metric: credits
    limit: 4000
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: API Access
  - name: Help Desk, Voice and Telephony
  - name: Outbound Campaigns
  - name: Advanced Integrations
  - name: 20 MB Training Data
  - name: 3 Team Seats
- id: chatbase-pro
  name: Pro
  type: subscription
  description: >-
    Higher tier with the largest standard credit allotment, advanced
    analytics, source suggestions, and ticket integration.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $500 per month ($400/mo billed annually)
    userMultiplied: false
  - label: Message Credits
    name: message_credits
    type: usage
    metric: credits
    limit: 15000
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Advanced Analytics
  - name: Source Suggestions
  - name: Ticket Integration
  - name: 40 MB Training Data
  - name: 5 Team Seats
- id: chatbase-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    Custom tier with higher limits, SSO, custom roles and permissions,
    white-labeling, audit logs, HIPAA eligibility, SLAs, and dedicated
    support. Contact sales.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: SSO and Custom Roles
  - name: White-Labeling
  - name: Audit Logs
  - name: HIPAA Eligibility
  - name: SLAs and Priority Support
- id: chatbase-addons
  name: Add-ons
  type: usage
  description: >-
    Optional add-ons available across paid plans for extra capacity and
    customization.
  entries:
  - label: Auto-Recharge Message Credits
    name: extra_credits
    type: usage
    metric: credits
    limit: -1
    timeFrame: month
    geo: global
    unit: 1000
    price: $40 per 1,000 message credits
    userMultiplied: false
  - label: Extra AI Agent
    name: extra_agent
    type: usage
    metric: agents
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: $300 per agent per year
    userMultiplied: false
  - label: Remove Chatbase Branding
    name: remove_branding
    type: flat
    metric: addon
    limit: 1
    timeFrame: year
    geo: global
    unit: 1
    price: $1,188 per year
    userMultiplied: false
  elements:
  - name: Auto-Recharge
  - name: Extra Agents
  - name: Branding Removal
maintainers:
