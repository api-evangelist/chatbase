  - Messages
  - Streaming
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.chatbase.co/docs/developer-guides/api-integration
  baseURL: https://www.chatbase.co/api/v1
  properties:
