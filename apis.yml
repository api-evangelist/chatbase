    type: Documentation
  - url: https://www.chatbase.co/docs/developer-guides/api/chat
    type: APIReference
  - url: openapi/chatbase-openapi.yml
    type: OpenAPI
  - url: collections/chatbase.postman_collection.json
    type: Postman
  description: Send a message to a Chatbase agent and receive a response. Accepts a
    messages array with user and assistant roles, supports continuing an existing
    conversation, temperature control, and word-by-word streaming via stream=true.
