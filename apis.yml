aid: chatbase
url: https://raw.githubusercontent.com/api-evangelist/chatbase/refs/heads/main/apis.yml
name: Chatbase
kind: company
description: Chatbase is a custom AI chatbot and AI agent platform for customer support.
  Teams train an agent on their own content (websites, files, Q&A), embed it on their
  site, and connect it to channels and tools. The Chatbase REST API lets developers
  message agents (with streaming), create and update chatbots/agents, retrieve
  conversations and leads, and manage contacts.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Chatbot
- AI Agent
- Customer Support
- Conversational AI
created: '2026-06-20'
modified: '2026-06-20'
specificationVersion: '0.19'
