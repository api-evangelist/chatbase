meters:
- name: plan_subscription
  description: Recurring monthly or annual subscription fee for the selected plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: message_credits
  description: Message credits consumed by AI responses; per-response cost varies by model.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - chatbot
  - model
- name: auto_recharge_credits
  description: Additional message credits purchased via auto-recharge when the plan allotment is exhausted.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: extra_agents
  description: Additional AI agents beyond the plan allotment, billed per agent per year.
  unit: agents
  aggregation: sum
  dimensions:
  - account
- name: branding_removal
  description: Annual add-on to remove Chatbase branding from the agent widget.
  unit: addon
  aggregation: sum
  dimensions:
  - account
- name: training_data
  description: Training-data size consumed against the plan cap.
  unit: bytes
  aggregation: max
  dimensions:
  - account
  - chatbot
principles:
- name: Visibility
  description: Track message-credit burn per agent and model in the Chatbase dashboard; watch for auto-recharge events that signal overage.
- name: Allocation
  description: Map agents and API keys to teams or customers; attribute credit consumption and seats to internal cost centers.
- name: Optimization
  description: Route responses to lower-credit standard models where quality allows; reserve premium models for high-value interactions; right-size the plan tier to actual credit usage.
- name: Accountability
  description: Assign an owner per workspace and agent; review monthly credit spend and add-on charges against budget before renewing or upgrading.
