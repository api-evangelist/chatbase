description: >-
  FinOps view of Chatbase spend. Chatbase bills a fixed monthly (or discounted
  annual) subscription per plan that includes a monthly message-credit
  allotment. Each AI response consumes message credits, with per-response cost
  varying by model. Overage is handled via auto-recharge credit packs. Extra
  AI agents and branding removal are additional recurring charges. Plan tier
  also governs training-data size, team seats, and feature access (API access
  starts on Standard).
notes: >-
  Per-plan prices, credit allotments, and per-model credit costs are subject
  to change; verify against the Chatbase pricing page during reconciliation.
sources:
- https://www.chatbase.co/pricing
- https://www.chatbase.co/docs
- https://focus.finops.org/focus-specification/v1-3/
